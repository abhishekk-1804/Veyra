name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Static Frontend Verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static frontend structure
        run: |
          test -f apps/web/index.html
          test -f apps/web/css/base.css
          test -f apps/web/css/layout.css
          test -f apps/web/css/components.css
          test -f apps/web/css/dashboard.css
          test -f apps/web/css/goals.css
          test -f apps/web/css/planner.css
          test -f apps/web/css/execution.css
          test -f apps/web/js/app.js
          test -f apps/web/js/api.js
          test -f apps/web/js/state.js
          test -f apps/web/js/router.js
          test -f apps/web/js/ui.js
          test -f apps/web/js/dashboard.js
          test -f apps/web/js/goals.js
          test -f apps/web/js/planner.js
          test -f apps/web/js/execution.js
          echo "Static vanilla frontend files verified."

  api:
    name: API (Test Suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest