<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veyra — AI-Native Execution Platform</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/goals.css" />
  <link rel="stylesheet" href="css/planner.css" />
  <link rel="stylesheet" href="css/execution.css" />
</head>
<body>
  <div class="app-container">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo">V</div>
        <span class="brand-title">Veyra</span>
        <span class="brand-tag">AI-Native</span>
      </div>

      <nav class="nav-menu">
        <a href="#dashboard" class="nav-link active" data-view="dashboard">
          <span>📊</span> Dashboard
        </a>
        <a href="#goals" class="nav-link" data-view="goals">
          <span>🎯</span> Goals & Tasks
        </a>
        <a href="#planner" class="nav-link" data-view="planner">
          <span>✨</span> AI Planner
        </a>
        <a href="#execution" class="nav-link" data-view="execution">
          <span>⚡</span> Execution
        </a>
      </nav>

      <div class="header-actions">
        <div class="system-status">
          <div class="status-dot"></div>
          <span class="status-label">INITIALIZING</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="main-content">
      <!-- Dashboard View -->
      <section id="dashboard-view" class="view-section active" data-view="dashboard"></section>

      <!-- Goals & Tasks View -->
      <section id="goals-view" class="view-section" data-view="goals"></section>

      <!-- AI Planner View -->
      <section id="planner-view" class="view-section" data-view="planner"></section>

      <!-- Execution View -->
      <section id="execution-view" class="view-section" data-view="execution"></section>
    </main>

    <!-- Modal Dialog System -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Modal Title</h3>
          <button class="btn btn-icon" onclick="document.getElementById('modal-overlay').classList.remove('active')">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-footer">
          <button id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button id="modal-confirm-btn" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Footer -->
    <footer class="app-footer">
      <div>Veyra Execution Platform v1.0.0</div>
      <div class="footer-manifesto">
        AI proposes. Deterministic code validates, persists, and executes.
      </div>
      <div>Python 3.12 • FastAPI • Vanilla ES</div>
    </footer>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
